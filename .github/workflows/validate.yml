name: Validate Nival Puntos Reseñas
on:
  push:
    branches:
      - feature/cimiento-neon-roles
      - feature/piloto-bloque-1
      - fix/admin-private-access
      - feature/full-site-qa
      - feature/paneles-planes-intuitivos
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          FOUNDATION_ENABLED: "false"
